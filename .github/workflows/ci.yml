name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit / integration tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check required files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f package.json
          test -f wrangler.toml
          test -f .cursor/environment.json
          test -f .github/workflows/ci.yml
          test -f vitest.config.ts
          test -d test
          test -f test/parser.test.ts
          test -f test/genres.test.ts
          test -f test/routes.test.ts
          test -f test/mcp.test.ts
          test -f test/helpers.ts
          test -f test/mcp-spec-contract.test.ts
          test -f test/ci-config.test.ts
          test -f test/wrangler-config.test.ts
          test -f test/source-contracts.test.ts
          test -f docs/mcp-spec.md
          grep -q 'thresholds' vitest.config.ts
          grep -q 'branches: 100' vitest.config.ts
          grep -q 'test:coverage' package.json
          grep -q 'permissions:' .github/workflows/ci.yml
          grep -q 'timeout-minutes:' .github/workflows/ci.yml
          grep -q 'gemini-2.0-flash' src/index.ts
          ! grep -RqiE 'anthropic|claude|haiku' src --include='*.ts'

      - name: Check for committed secret material
        run: |
          ! grep -RInE '(api[_-]?key|secret|token|password)\s*[:=]\s*["'\'']?[A-Za-z0-9_\-]{8,}' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=coverage \
            --exclude='*.md' \
            --exclude='package-lock.json' \
            .
