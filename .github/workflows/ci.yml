name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit / integration tests with coverage
        run: npm run test:coverage

      - name: Assert coverage artifacts exist
        run: |
          test -d coverage
          test -f coverage/lcov.info
          test -s coverage/lcov.info
          grep -q 'SF:src/' coverage/lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check required files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f package.json
          test -f package-lock.json
          test -f wrangler.toml
          test -f .cursor/environment.json
          test -f .github/workflows/ci.yml
          test -f .github/workflows/deploy.yml
          test -f .github/dependabot.yml
          test -f vitest.config.ts
          test -f tsconfig.json
          test -d test
          test -f test/parser.test.ts
          test -f test/genres.test.ts
          test -f test/routes.test.ts
          test -f test/mcp.test.ts
          test -f test/helpers.ts
          test -f test/helpers.test.ts
          test -f test/mcp-spec-contract.test.ts
          test -f test/ci-config.test.ts
          test -f test/wrangler-config.test.ts
          test -f test/source-contracts.test.ts
          test -f docs/mcp-spec.md
          test -f src/index.ts
          test -f src/parser.ts
          test -f src/genres.ts
          test -f src/mcp.ts
          test -f src/types.ts
          grep -q 'thresholds' vitest.config.ts
          grep -q 'branches: 100' vitest.config.ts
          grep -q 'lines: 100' vitest.config.ts
          grep -q 'functions: 100' vitest.config.ts
          grep -q 'statements: 100' vitest.config.ts
          grep -q 'test:coverage' package.json
          grep -q 'permissions:' .github/workflows/ci.yml
          grep -q 'timeout-minutes:' .github/workflows/ci.yml
          grep -q 'node-version: "20"' .github/workflows/ci.yml
          grep -q 'workflow_dispatch' .github/workflows/deploy.yml
          grep -q 'persist-credentials: false' .github/workflows/ci.yml
          grep -q 'Assert coverage artifacts exist' .github/workflows/ci.yml
          grep -q 'shell: bash' .github/workflows/ci.yml
          grep -q 'gemini-2.0-flash' src/index.ts
          grep -qE '"typescript": "\^5\.' package.json
          ! grep -qE '"typescript": "\^[67]\.' package.json
          ! grep -RqiE 'anthropic|claude|haiku' src --include='*.ts'
          ! grep -RqiE 'anthropic|claude|haiku' .github/workflows --include='*.yml'
          grep -q 'GEMINI_API_KEY' .github/workflows/deploy.yml
          grep -q 'npm run typecheck' .github/workflows/deploy.yml
          grep -q 'npm run test:coverage' .github/workflows/deploy.yml
          grep -q 'cancel-in-progress: true' .github/workflows/ci.yml
          grep -q 'upload-artifact@v4' .github/workflows/ci.yml
          grep -q 'if-no-files-found: error' .github/workflows/ci.yml
          grep -q "src/types.ts" vitest.config.ts
          grep -q 'github-actions' vitest.config.ts
          grep -q 'lcov' vitest.config.ts
          grep -q '"hono"' package.json
          ! grep -q 'GEMINI_API_KEY=' wrangler.toml
          ! grep -qiE 'api[_-]?key\s*=' wrangler.toml
          # Trigger must be push/pull_request only (not pull_request_target)
          awk '/^on:/{f=1} f && /^jobs:/{exit} f' .github/workflows/ci.yml | grep -q 'pull_request:'
          ! awk '/^on:/{f=1} f && /^[^[:space:]#]/{if($0 !~ /^on:/) exit} f' .github/workflows/ci.yml | grep -q 'pull_request_target'
          ! awk '/^on:/{f=1} f && /^[^[:space:]#]/{if($0 !~ /^on:/) exit} f' .github/workflows/deploy.yml | grep -q 'pull_request_target'
      - name: Check for committed secret material
        run: |
          ! grep -RInE '(api[_-]?key|secret|token|password|private[_-]?key)\s*[:=]\s*["'\'']?[A-Za-z0-9_\-]{8,}' \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=coverage \
            --exclude='*.md' \
            --exclude='package-lock.json' \
            .
          ! test -f .env
          ! test -f .dev.vars
          ! find . \( -name '*.pem' -o -name '*.key' \) ! -path './node_modules/*' ! -path './.git/*' | grep -q .